<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập — My Workspace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-brand__mark">M</span>
        <span class="auth-brand__name">My Workspace</span>
      </div>
      <p class="auth-subtitle">Quản lý project, deadline và notes của bạn</p>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email" placeholder="ban@example.com" />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />

        <button type="submit" class="btn btn--primary btn--block" id="login-submit" style="margin-top:22px;">
          Đăng nhập
        </button>
      </form>

      <p class="auth-footer-note">Tài khoản được tạo trong Supabase Auth (Dashboard → Authentication).</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="components/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
